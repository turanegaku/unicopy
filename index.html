<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JIS漢字 ＆ 変体仮名 ワンクリックコピーツール</title>
  <!-- 「字」＋重なった四角でコピー。配布版が1ファイルなので data URI で持つ -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect y='8' width='56' height='56' rx='10' fill='%23aed6f1'/><rect x='8' width='56' height='56' rx='10' fill='%232980b9'/><path d='M36 7v6M19 21v-6h34v6M25 24h21l-9 7v14q0 3.5-5 3.5M17 37h38' fill='none' stroke='%23fff' stroke-width='5' stroke-linejoin='round'/></svg>">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Hentaigana:wght@400;700&family=Noto+Serif+JP:wght@400;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="app.css">
</head>
<body>

  <h1>JIS漢字 ＆ 変体仮名 コピーツール</h1>

  <div class="tabs" id="tabsBar">
    <button class="tab-btn active" onclick="switchTab('kanji')">漢字モード</button>
    <button class="tab-btn" onclick="switchTab('hentaigana')">変体仮名モード</button>
  </div>

  <!-- ================= 漢字モード ================= -->
  <div id="kanji" class="tab-content active">
    <div class="tree-bar">
      <div class="find-row">
        <span class="bar-label">表示</span>
        <div class="row-body">
          <label class="file-btn" id="dataBtn" title="縮退データは未読込です"><span class="dot"></span>データ<input type="file" id="mjmapInput" accept=".json" hidden></label>
          <label class="switch"><input type="checkbox" id="showList" checked> 一覧</label>
          <label class="switch"><input type="checkbox" id="showTree" disabled> 縮退ツリー</label>
          <button id="fontBadge" class="font-status-btn status-inactive" title="クリックでIPAmj明朝による字形描画をON/OFFできます">IPAmj判定中...</button>
        </div>
      </div>
      <div class="find-row">
        <span class="bar-label">縮退の根拠</span>
        <div class="row-body"><span id="srcSwitches"></span></div>
      </div>
      <div class="find-row">
        <span class="bar-label">凡例</span>
        <div class="row-body legend"><span><b>実線</b>=規格</span><span><b class="kj">橙</b>=<a href="https://www.bunka.go.jp/kokugo_nihongo/sisaku/joho/joho/kijun/naikaku/kanji/" target="_blank" rel="noopener">常用漢字表</a>の新旧字体</span><span><b class="law">破線</b>=法令・告示</span></div>
      </div>
    </div>
    <!-- 移動はパネルの最上段に見せるが、パネルの外（兄弟）に置く。中に入れると、パネルを抜けたところで
         貼り付きも外れ、一覧のあいだ見えなくなる -->
    <div class="find-row jump-row jump-bar" id="kanjiJumpRow">
      <span class="bar-label">移動</span>
      <span class="row-body" id="sectionJump"></span>
    </div>
    <div class="search-container" id="radicalListboxes">
      <div class="find-row" id="filterRow">
        <span class="bar-label">絞り込み</span>
        <div class="row-body">
          <label class="switch"><input type="checkbox" id="onlyJinmei"> 人名用漢字だけ <span class="n" id="jinmeiN"></span></label>
          <label class="switch" title="いま選んでいる根拠で縮退が1本でも定義されている字だけを出す。縮退元・縮退先のどちらでも当たる。包摂・統合を外せば、包摂だけで繋がっている字も消える"><input type="checkbox" id="onlyShrink"> 縮退があるものだけ <span class="n" id="shrinkN"></span></label>
          <select id="kuFilter" class="sel"></select>
        </div>
      </div>
      <div class="find-row" id="searchRow">
        <input type="text" id="mjSearch" placeholder="検索　会 / U+4F1A / MJ006586 / 1-18-81" disabled>
        <span class="status" id="mjmapStatus"></span>
      </div>
    </div>
    <div id="kanjiPanes">
      <div id="kanjiContainer"></div>
      <div id="treePane"><div class="tree-empty">縮退データ未読込</div></div>
      <button type="button" id="treeClose" aria-controls="treePane"><span>縮退ツリー</span><span>閉じる ×</span></button>
    </div>
  </div>

  <!-- ================= 変体仮名モード ================= -->
  <div id="hentaigana" class="tab-content">
    <div class="find-row jump-row jump-bar alone" id="kanaJumpRow">
      <span class="bar-label">移動</span>
      <span class="row-body" id="kanaJump"></span>
    </div>
    <div id="hentaiganaContainer"></div>
  </div>

  <footer class="credit">文字情報基盤 <a href="https://moji.or.jp/mojikiban/mjlist/" target="_blank" rel="noopener">MJ文字情報一覧表</a>・<a href="https://moji.or.jp/mojikiban/map/" target="_blank" rel="noopener">MJ縮退マップ</a> (IPA, CC BY-SA 2.1 JP)　／　部首は <a href="https://github.com/cjkvi/cjkvi-ids" target="_blank" rel="noopener">CJKVI IDS</a>（CHISE IDS Database）・辞書の部首は <a href="https://www.unicode.org/charts/unihan.html" target="_blank" rel="noopener">Unihan</a></footer>

  <div id="toast">コピーしました</div>

  <script src="parts.js"></script>
  <script src="app.js"></script>
</body>
</html>
